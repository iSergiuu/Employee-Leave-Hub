<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Autentificare</h2>
      <p>Bine ai revenit la Employee Leave Hub</p>
    </div>

    <form class="auth-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      
      <div class="form-group">
        <label>Adresă de email</label>
        <input type="email" formControlName="email" placeholder="Introdu email-ul...">
        <div class="error-text" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          Email invalid. Verifică să conțină '@'.
        </div>
      </div>

      <div class="form-group">
        <label>Parolă</label>
        <input type="password" formControlName="password" placeholder="Introdu parola...">
        <div class="error-text" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Te rugăm să introduci parola.
        </div>
      </div>

      <button type="submit" class="btn-primary" [disabled]="loginForm.invalid">Intră în cont</button>
    </form>

    <div class="auth-footer">
      <p>Nu ai cont? <a routerLink="/register">Înregistrează-te aici</a></p>
    </div>
  </div>
</div>
