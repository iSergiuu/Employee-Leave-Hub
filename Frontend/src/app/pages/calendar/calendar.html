<div class="calendar-wrapper fade-in-up">
  <div class="header-section">
    <div>
      <h2 class="page-title">Planificare Concedii</h2>
      <p class="page-subtitle text-muted">Gestionează și vizualizează perioadele de absență</p>
    </div>
    
    <div style="display: flex; gap: 15px; align-items: center;">
      
      <button *ngIf="isManagerOrAdmin && currentView === 'department'"
              (click)="downloadDepartmentReport()"
              style="padding: 8px 16px; background-color: #10b981; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; box-shadow: 0 2px 4px rgba(16, 185, 129, 0.2); transition: all 0.2s;"
              title="Descarcă raportul pentru luna afișată pe calendar">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        Raport Luna Afișată
      </button>

      <div class="custom-toggle" *ngIf="isManagerOrAdmin">
        <input type="radio" id="view-personal" name="calendarView" 
               [checked]="currentView === 'personal'" 
               (change)="onViewChange('personal')">
        <label for="view-personal" class="toggle-label">Cererile Mele</label>
        
        <input type="radio" id="view-department" name="calendarView" 
               [checked]="currentView === 'department'"
               (change)="onViewChange('department')">
        <label for="view-department" class="toggle-label">Departament</label>
        
        <div class="toggle-slider"></div>
      </div>

    </div>
  </div>

  <div class="calendar-card">
    <full-calendar [options]="calendarOptions"></full-calendar>
  </div>
</div>
